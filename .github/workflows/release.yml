name: Release

# Publishes the gem to RubyGems.org with trusted publishing (OIDC): no API
# key is stored in the repository. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # rake release (run by release-gem) pushes the tag if it is missing
      id-token: write # OIDC token for RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/docuconf/anyway/version -e 'print Docuconf::Anyway::VERSION')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - name: Run specs
        run: bundle exec rspec

      - uses: rubygems/release-gem@v1
