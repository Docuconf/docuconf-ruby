name: Release

# Publishes the gem to RubyGems.org with trusted publishing (OIDC): no API
# key is stored in the repository. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # rake release (run by release-gem) pushes the tag if it is missing
      id-token: write # OIDC token for RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/docuconf/anyway/version -e 'print Docuconf::Anyway::VERSION')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - name: Run specs
        run: bundle exec rspec

      - uses: rubygems/release-gem@v1

  # Also pushes the gem to GitHub Packages (rubygems.pkg.github.com) and
  # attaches the .gem to the GitHub Release for the tag. It runs the same
  # checks as `release` but does not depend on it, so it works with only the
  # workflow's GITHUB_TOKEN. See RELEASING.md.
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write # push to rubygems.pkg.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/docuconf/anyway/version -e 'print Docuconf::Anyway::VERSION')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run specs
        run: bundle exec rspec

      - name: Build the gem
        run: gem build docuconf-anyway.gemspec --output "docuconf-anyway-$VERSION.gem"

      - name: Push the gem to GitHub Packages
        env:
          GEM_HOST_API_KEY: Bearer ${{ secrets.GITHUB_TOKEN }}
        run: gem push --host https://rubygems.pkg.github.com/Docuconf "docuconf-anyway-$VERSION.gem"

      - name: Attach the gem to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            case "$VERSION" in *-* | *.pre* | *.beta* | *.alpha* | *.rc*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "docuconf-anyway $VERSION" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "docuconf-anyway-$VERSION.gem" --clobber
