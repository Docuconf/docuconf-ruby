name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    env:
      # Installs railties for the Railtie specs (and ActiveSupport::Duration).
      BUNDLE_WITH: rails
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the shared conformance suite
      # (conformance/cases.json) live in docuconf-go: the export spec vets
      # generated contracts against the meta-schema, and the conformance
      # spec runs every case.
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Run specs
        run: bundle exec rspec
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      - name: Build the gem
        run: gem build docuconf-anyway.gemspec

  example:
    # examples/orders: builds against the SDK in this repository, checks the
    # committed contract is current and valid, and smoke-tests the service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/orders
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: examples/orders

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build
        run: bundle exec ruby -c config.ru server.rb config/orders_config.rb

      # Ignores metadata.generator.version, which release PRs bump.
      - name: Contract is up to date
        run: |
          bundle exec docuconf export --name orders-api --package orders --out contract.cue config/orders_config.rb
          ../../scripts/check-generated.sh contract.cue

      - name: Contract passes cue vet
        run: |
          vet="$RUNNER_TEMP/vet"
          mkdir -p "$vet/orders"
          cp -r "$GITHUB_WORKSPACE/docuconf-go/spec/cue/cue.mod" "$GITHUB_WORKSPACE/docuconf-go/spec/cue/contract" "$vet/"
          cp contract.cue "$vet/orders/"
          cd "$vet" && cue vet -c ./orders

      - name: Smoke test
        run: ./smoke.sh
