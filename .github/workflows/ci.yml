name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    env:
      # Installs railties for the Railtie specs (and ActiveSupport::Duration).
      BUNDLE_WITH: rails
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the shared conformance suite
      # (conformance/cases.json) live in docuconf-go: the export spec vets
      # generated contracts against the meta-schema, and the conformance
      # spec runs every case.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build the docuconf CLI
        run: (cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .)

      # The docuconf-go-facing subset (conformance suite, which fails if any
      # case is skipped; the shared export fixture; cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf
      - name: Run specs
        run: bundle exec rspec
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      # The shared export fixture (docuconf-go conformance/export), declared
      # in spec/fixtures/export_fixture.rb, compared as data with the golden
      # contract. spec/export_fixture_spec.rb runs the same check.
      - name: Shared export fixture matches the golden contract
        run: |
          bundle exec ruby -Ilib -rdocuconf/anyway -r./spec/fixtures/export_fixture -e \
            'print Docuconf::Anyway.export(name: "docuconf-fixture", app_version: "1.0.0", classes: [Fixtures::ExportFixture], profiles: false)' \
            > "$RUNNER_TEMP/exported.cue"
          "$RUNNER_TEMP/docuconf" conformance export --golden docuconf-go/conformance/export/golden.cue "$RUNNER_TEMP/exported.cue"

      - name: Build the gem
        run: gem build docuconf-anyway.gemspec

  example:
    # examples/orders: builds against the SDK in this repository, checks the
    # committed contract is current and valid, and smoke-tests the service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/orders
    steps:
      - uses: actions/checkout@v4

      - name: Pick the docuconf-go ref
        id: dcref
        # This job's run steps default to examples/orders.
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: examples/orders

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build
        run: bundle exec ruby -c config.ru server.rb config/orders_config.rb webhook.rb

      # The webhook key set: a rotation, and the key sets that fail at boot.
      - name: Test
        run: bundle exec ruby test/webhook_test.rb

      # Ignores metadata.generator.version, which release PRs bump.
      - name: Contract is up to date
        run: |
          bundle exec docuconf export --name orders-api --package orders --out contract.cue config/orders_config.rb
          ../../scripts/check-generated.sh contract.cue

      - name: Contract passes cue vet
        run: |
          vet="$RUNNER_TEMP/vet"
          mkdir -p "$vet/orders"
          cp -r "$GITHUB_WORKSPACE/docuconf-go/spec/cue/cue.mod" "$GITHUB_WORKSPACE/docuconf-go/spec/cue/contract" "$vet/"
          cp contract.cue "$vet/orders/"
          cd "$vet" && cue vet -c ./orders

      # CONFIG.md, CONFIG.agents.md and docs.json are generated from the
      # contract by docuconf docs, built from the docuconf-go checkout; they
      # must match what it writes today. These are the README's commands.
      - name: Generated docs are up to date
        run: |
          (cd "$GITHUB_WORKSPACE/docuconf-go/cmd/docuconf" && go build -o "$RUNNER_TEMP/docuconf" .)
          # "Contract is up to date" re-exports contract.cue in place; check
          # the docs against the committed one (and its generator.version).
          git checkout -- contract.cue
          "$RUNNER_TEMP/docuconf" docs contract.cue --check CONFIG.md
          "$RUNNER_TEMP/docuconf" docs contract.cue --format agents --check CONFIG.agents.md
          "$RUNNER_TEMP/docuconf" docs contract.cue --format model --check docs.json

      - name: Smoke test
        run: ./smoke.sh
